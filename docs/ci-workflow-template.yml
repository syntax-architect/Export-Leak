name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NODE_ENV: test
      EXPORTLEAK_E2E_ADAPTER: pglite
      RAZORPAY_WEBHOOK_SECRET: test_webhook_secret_for_ci_12345
      RAZORPAY_KEY_ID: rzp_test_mock_ci
      RAZORPAY_KEY_SECRET: rzp_test_secret_mock_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Code Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: Build Next.js Production App
        run: npm run build

      - name: Verify No Secrets Leaked in Client Bundles
        run: |
          if grep -rn "test_secret_mock_ci" .next/static; then
            echo "Security Error: Found leaked secret in .next/static!"
            exit 1
          fi

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test
